[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webber"
version = "0.2.0"
description = "A build system written in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Adi Degani", email = "adid172@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
	"build==1.6.1",
	"certifi==2026.7.22",
	"cffi==2.1.1",
	"charset-normalizer==3.5.1",
	"curl_cffi==0.16.3",
	"idna==3.19",
	"Jinja2==3.1.6",
	"MarkupSafe==3.0.3",
	"packaging==26.3",
	"prompt_toolkit==3.0.53",
	"pycparser==3.0",
	"pyproject_hooks==1.2.0",
	"tabulate==0.10.0",
	"urllib3==2.7.0",
	"wcwidth==0.8.3",
]

[project.urls]
Homepage = "https://github.com/airlobster/projects/tree/main/webber"
Issues = "https://github.com/airlobster/projects/tree/main/webber/issues"

[project.scripts]
webber = "webber.main:main"

[tool.setuptools.packages.find]
where = ["src"]
