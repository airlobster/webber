[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webber"
version = "0.2.0"
description = "A build system written in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Adi Degani", email = "adid172@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = [ "dependencies" ]

[project.urls]
Homepage = "https://github.com/airlobster/projects/tree/main/webber"
Issues = "https://github.com/airlobster/projects/tree/main/webber/issues"

[project.scripts]
webber = "webber.main:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webber = ["templates/*.jinja2"]
